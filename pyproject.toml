[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-music"
version = "0.1.0"
description = "Progressive music recommender on Last.fm HetRec 2011 (ESADE individual project)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=recsys --cov-report=term-missing"

[tool.black]
line-length = 90

[tool.ruff]
line-length = 90

[tool.ruff.lint.per-file-ignores]
# main.py and cold_start.py set sys.path before importing recsys so they run under a
# plain `pip install` (not only the editable install), which legitimately needs E402.
"main.py" = ["E402"]
"scripts/cold_start.py" = ["E402"]
